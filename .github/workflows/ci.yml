name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Org standard runner; fall back to ubuntu-latest if Blacksmith doesn't pick the job up.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.12 is the floor this suite was verified against (also passes on 3.11
      # and 3.14); tools/ imports stdlib only, so nothing else is pinned.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # plistlib is stricter than launchd's own parser (e.g. rejects '--'
      # inside XML comments), so this catches drift plutil would let slide.
      - name: Lint launchd plists
        run: |
          python - <<'PY'
          import glob
          import os
          import plistlib

          prefix = "/Users/anthonyflores/code/fully-aware/"
          plists = sorted(glob.glob("launchd/*.plist"))
          assert plists, "no plists found"
          repo_path_arguments = 0

          for plist_path in plists:
              with open(plist_path, "rb") as handle:
                  plist = plistlib.load(handle)
              if "ProgramArguments" not in plist:
                  raise AssertionError(f"{plist_path}: missing ProgramArguments")

              for argument in plist["ProgramArguments"]:
                  if not isinstance(argument, str) or not argument.startswith(prefix):
                      continue
                  relative_path = argument[len(prefix):]
                  target_path = os.path.join(os.getcwd(), relative_path)
                  if not os.path.isfile(target_path):
                      raise AssertionError(f"{plist_path}: {argument}: missing/not file")
                  if not os.access(target_path, os.X_OK):
                      raise AssertionError(f"{plist_path}: {argument}: not executable")
                  repo_path_arguments += 1

          print(f"{len(plists)} plists OK; {repo_path_arguments} repo-path arguments verified")
          PY

      # Shellcheck is preinstalled on Ubuntu; -S error is a floor, so
      # style/info findings do not gate CI.
      - name: Shellcheck shell scripts
        shell: bash
        run: |
          shopt -s globstar nullglob
          scripts=(tools/**/*.sh)
          if (( ${#scripts[@]} == 0 )); then
              echo "No shell scripts found under tools/" >&2
              exit 1
          fi
          echo "Shellcheck files (${#scripts[@]}):"
          printf '%s\n' "${scripts[@]}"
          shellcheck -S error "${scripts[@]}"

      # The suite has no third-party imports beyond the runner itself.
      - name: Install test runner
        run: python -m pip install --upgrade pip 'pytest~=9.1'

      - name: Run tests
        run: python -m pytest tools/

# Channel scan queue — YouTube channels queued for full-catalog deep dives.
# schema: channel-scan-queue/v1 (intake; hand-consumed, no automation attached yet)
# Rules: entries are proposals; a deep dive per video lands in intake/video-deep-dives/.
# Consumption order: priority desc, then queued_at asc.

schema: channel-scan-queue/v1
last_updated: '2026-07-30'
maintained_by: session (proposals) / Anthony+Ryan ratify

access_notes: |
  From a Claude Code remote session the working route is YouTube Innertube on
  youtubei.googleapis.com (youtube.com itself is blocked by the environment
  network policy):
    - POST /youtubei/v1/next   {context.client WEB, videoId}  -> title, channel,
      date, views, full description, chapters (macroMarkersListItemRenderer).
    - POST /youtubei/v1/browse {context.client WEB, browseId, params} -> channel
      metadata + video catalog (lockupViewModel items) + continuations.
  NOT available without an authenticated session: player (bot-check) and
  get_transcript (precondition failure) -> word-for-word transcripts need a local
  machine (yt-dlp / youtube-transcript-api) or a network-policy allowlist for
  youtube.com. YOUTUBE_API_KEY / APIFY_TOKEN exist only in local .env files
  (ryan-super-affiliate/market-engine/.env), not in this remote environment.


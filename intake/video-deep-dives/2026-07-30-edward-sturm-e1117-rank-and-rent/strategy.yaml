framework_name: "Rank-and-Rent Local SEO System"
author: "Ippei Kanehara (interviewed by Edward Sturm)"
source: "The Edward Show E1117 + ippei.com"
core_thesis: |
  Rank your OWN site under your OWN invented local brand for bottom-of-funnel
  "{service} {city}" searches, put a tracking phone number on it, and rent the
  ringing phone to a local operator - commission first, flat monthly after trust.
  You keep the asset, brand, domain, and number; tenants churn less than agency
  clients because cancelling means giving up a working phone line; and commercial
  local intent survives the Google core updates that wreck content sites. Proof:
  a ~15-hour tree-care site has paid ~$2K/month for 11 years ($240K+), while the
  author's own content blog lost ~90% of its clicks to updates in the same years.

core_principles:

  principle_1:
    name: "The Whisper Message Is the Sales Engine"
    description: |
      Call tracking plays "this lead was sent to you by [name]" before every
      connected call. The tenant hears your name on every job, so the eventual
      pitch is warm: "I'm the guy who's been sending you those leads."
    application:
      - Tracking number + whisper message wired before monetization
      - Free leads for days -> "want more of these customers?" call
      - Start on commission (zero tenant risk), convert to flat rent after 1-2 months
      - Flat rent $1,000-$2,000/month per site once trust exists

  principle_2:
    name: "Bill Weekly, Own the Rails"
    description: |
      Card on file in Stripe, billed weekly: $250/week never reads like a big
      monthly bill. Tenants unspoken-to for years keep paying; no reports or
      handholding owed - "I get you the leads, you pay me for the leads."
      Whale tier: call tracking API-wired into the tenant's CRM, straight
      commission per closed job (works across dozens of sites / 7 niches for
      one LA construction tenant).
    application:
      - Weekly Stripe billing as a churn hack
      - Keep domain, site, and phone number ownership in every deal
      - "[transcript-needed] contract/leverage terms (1:16:16)"

  principle_3:
    name: "Niche Filter With Numbers"
    description: |
      Phone-driven home-construction services, average customer value >= $2-3K,
      fast close. Three kill criteria: low-ticket commoditized (carpet cleaning -
      TaskRabbit), over-saturated (plumbing/HVAC), high-ticket-slow-close
      (kitchen/bath remodel, ADU - price shoppers, months to close). Sub-niches
      with real volume (epoxy flooring, garage storage) rank trivially. Sites
      also catch commercial jobs (a $200K commercial roofing close).
      Sell-side psychology: small contractors are pre-burned by $500/month junk
      agencies and distrust SEO - delivering customers first sidesteps the
      entire objection.
    application:
      - Enumerate services per home (drywall, paint, cabinets, countertops, concrete, gates, foundation, tree care)
      - City 80K minimum, 100-300K sweet spot
      - Demand proxy is the Maps pack (10-15 businesses = demand), NOT keyword-tool volume (local BOF often shows zero)

  principle_4:
    name: "Read the SERP Manually, Bet on Topical Authority"
    description: |
      Never trust DR/keyword-difficulty alone. Open the actual top 3-5 local
      results and audit them: heading structure, indexed page count (site: often
      ~10 pages), accidental vs intentional keyword targeting, domain type.
      Avoid DR-30+ SERPs (personal-injury law); most home-construction SERPs sit
      at DR <=5. Against a weak 10-page site, 30-40 targeted BOF pages win
      WITHOUT backlinks. Saturation is SERP-level, not niche-level - pick and
      choose your battles.
    application:
      - SERP audit checklist: DR <=5, ~10 indexed pages, broken heading hierarchy, no keyword intent
      - Launch toward 30-40 indexed pages of topical coverage
      - "[transcript-needed] internal linking + doorway avoidance (31:36-36:31)"

  principle_5:
    name: "Brand-First On-Page Formula"
    description: |
      Mint a partial exact-match brand ("{City} Quality {Service}") since true
      EMDs are taken. H1 and page title start with the brand name, then main
      keywords. First 1-2 paragraphs define the entity: repeat the brand,
      enumerate exact services. Then entity-load the page with industry
      vocabulary - materials, engineering terms, expertise words nobody searches
      but Google scores. Write AS the brand, for no tenant in particular; the
      renter ends up operating two brands - "a franchise, but better."
    application:
      - "H1: 'Glendale Quality Drywall' + services; first sentence: brand + years + X, Y, Z services"
      - Entity list per niche (materials, techniques, certifications)
      - "[transcript-needed] must-have page list, AI workflow, image sourcing (28:22, 39:44, 56:35)"

  principle_6:
    name: "GBP Is Optional Upside, Not the Model"
    description: |
      The 'rank and rent is dead' claim comes from operators who only farmed
      Google Business Profiles. Ranking the WEBSITE is the model; GBP is added
      where possible (video verification still works, 'a bit more gray hat') -
      only 30-40% of the author's current 130 sites have one; a student clears
      $15-20K/month with zero. Niche-dependent: urgent niches (towing) are
      GBP/call-driven; consideration niches (custom cabinets) are
      website/design-driven - and most local sites are ugly enough that design
      alone converts.
    application:
      - Decide GBP effort per niche urgency profile
      - "[transcript-needed] video-verification method + review tactics (57:59-1:05:52)"

  principle_7:
    name: "Scale the Tenant, Then the Portfolio"
    description: |
      Service businesses travel 20-30 miles: a $500/month tenant becomes
      $2-3K/month as you build sibling-city sites and rent the cluster. Build
      many sites (portfolio math beats one perfect site; 130 sites in the
      author's last year alone). Bottom-of-funnel intent makes the portfolio
      update-resilient where content sites are not.
    application:
      - "[transcript-needed] first-30-days launch sequence (51:09)"
      - "[transcript-needed] keyword mining: autocomplete + GSC, new-page-vs-expand rule (43:34-48:31)"
      - "[transcript-needed] mega brand rollup + failure post-mortems (1:21:51, 1:27:18)"

affiliate_engine_mapping:
  scan: "Niche filter + Maps-pack demand proxy reusable as market-engine pack criteria"
  vet: "Manual SERP audit (DR<=5, ~10 indexed pages, accidental targeting) is a ready competition gate"
  route: "A ranked local site is a permanently-owned BRIDGE with a phone number; whisper + free-leads close maps to pay-per-call offers"
  build: "Hub/service/sub-city BOF architecture + entity loading -> 02-page-builder checklist"
  learn: "Weekly billing churn hack and commercial-intent update-resilience generalize beyond local SEO"
